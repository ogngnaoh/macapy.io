    <text x="1136" y="537" text-anchor="end" font-size="23" font-weight="500" letter-spacing="1">macos 26+</text>
    <text x="64" y="594" font-size="17" letter-spacing="1.2">transcribe / review / remember</text>
    <text x="1136" y="594" text-anchor="end" font-size="17" letter-spacing="1.2">no backend. no meeting bot.</text>
