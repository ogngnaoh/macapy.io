[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    integration: Integration tests requiring external services (OpenAI, database)
    unit: Unit tests with no external dependencies
    slow: Tests that take significant time to run
